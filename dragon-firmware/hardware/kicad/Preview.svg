 stroke-width="0.3" fill="none"/><path d="M330,195 L330,95" stroke="#168043" stroke-width="0.3" fill="none"/><text x="47.62" y="194.3" font-size="1.4" fill="#168043">GPIO10_VSENSE</text><path d="M275.0,67.54 L275,95" stroke="#168043" stroke-width="0.3" fill="none"/><path d="M275,95 L275.0,116.19" stroke="#168043" stroke-width="0.3" fill="none"/><path d="M260,95 L275,95" stroke="#168043" stroke-width="0.3" fill="none"/><path d="M275,95 L300,95" stroke="#168043" stroke-width="0.3" fill="none"/><path d="M300,95 L300.0,116.19" stroke="#168043" stroke-width="0.3" fill="none"/><path d="M345.0,68.81 L345,95" stroke="#168043" stroke-width="0.3" fill="none"/><path d="M345,95 L345.0,116.19" stroke="#168043" stroke-width="0.3" fill="none"/><path d="M330,95 L345,95" stroke="#168043" stroke-width="0.3" fill="none"/><path d="M345,95 L375,95" stroke="#168043" stroke-width="0.3" fill="none"/><path d="M375,95 L375.0,116.19" stroke="#168043" stroke-width="0.3" fill="none"/><text x="60" y="85" font-size="1.25" fill="#15304a">1 = 5V / VBUS</text><text x="60" y="88" font-size="1.25" fill="#15304a">2 = GND</text><text x="60" y="91" font-size="1.25" fill="#15304a">3 = 3V3</text><text x="60" y="94" font-size="1.25" fill="#15304a">4 = GPIO13 / unused</text><text x="60" y="97" font-size="1.25" fill="#15304a">5 = GPIO12 / matrix</text><text x="60" y="100" font-size="1.25" fill="#15304a">6 = GPIO11 / touch</text><text x="60" y="103" font-size="1.25" fill="#15304a">7 = GPIO10 / voltage</text><text x="60" y="106" font-size="1.25" fill="#15304a">8 = GPIO9 / LDR</text><path d="M49.32,79.4 l1.2,1.2 m-1.2,0 l1.2,-1.2" stroke="#168043" stroke-width="0.25"/><text x="15" y="14" font-size="3" fill="#15304a">DRAGON LAMP - MODULE WIRING SCHEMATIC</text><text x="15" y="20" font-size="1.6" fill="#15304a">Official KiCad 8 symbols. J1 follows supplied physical row order: 5V, GND, 3V3, 13, 12, 11, 10, 9. Other connectors are wired interfaces.</text><text x="125" y="57" font-size="1.4" fill="#15304a">J2: 1=5V, 2=GND, 3=DIN</text><text x="190" y="57" font-size="1.4" fill="#15304a">J3: 1=3V3, 2=GND, 3=OUT</text><text x="245" y="49" font-size="2" fill="#15304a">LIGHT DIVIDER</text><text x="325" y="49" font-size="2" fill="#15304a">SUPPLY DIVIDER</text><text x="15" y="214" font-size="1.6" fill="#15304a">J4: 1=VBUS, 2=GND. Existing USB-C breakout includes CC resistors; D+/D- unused.</text><text x="15" y="219" font-size="1.6" fill="#15304a">Use PC USB into ESP32 OR external 5V at J4; never both powered without source isolation.</text><text x="15" y="224" font-size="1.6" fill="#15304a">External supply: branch matrix power directly from source. All grounds common. 1000uF bulk capacitor is OFF BOARD across USB breakout VBUS/GND.</text><text x="15" y="229" font-size="1.6" fill="#15304a">TTP223 and LDR share 3.3V. C2 is PCB bypass; keep a 100nF bypass near the remote TTP223 too. C4 is near GPIO10. C3 is optional filtering.</text><text x="15" y="234" font-size="1.6" fill="#15304a">Divider: GPIO10 = VBUS / 6; at 5.00V expect 0.833V. J5: 1=3V3, 2=GPIO9 to remote LDR. No microphone.</text><text x="15" y="239" font-size="1.6" fill="#15304a">Direct 3.3V LED data matches prototype; add a suitable 5V logic buffer if required by the actual matrix.</text><circle cx="25" cy="35" r="0.65" fill="#168043"/><circle cx="230.0" cy="150" r="0.65" fill="#168043"/><circle cx="375.0" cy="150" r="0.65" fill="#168043"/><circle cx="275.0" cy="35" r="0.65" fill="#168043"/><circle cx="300.0" cy="150" r="0.65" fill="#168043"/><circle cx="20" cy="25" r="0.65" fill="#168043"/><circle cx="200" cy="35" r="0.65" fill="#168043"/><circle cx="130" cy="25" r="0.65" fill="#168043"/><circle cx="132" cy="150" r="0.65" fill="#168043"/><circle cx="275.0" cy="150" r="0.65" fill="#168043"/><circle cx="275" cy="95" r="0.65" fill="#168043"/><circle cx="202" cy="150" r="0.65" fill="#168043"/><circle cx="15" cy="150" r="0.65" fill="#168043"/><circle cx="345.0" cy="25" r="0.65" fill="#168043"/><circle cx="230.0" cy="35" r="0.65" fill="#168043"/><circle cx="345.0" cy="150" r="0.65" fill="#168043"/><circle cx="345" cy="95" r="0.65" fill="#168043"/><circle cx="10" cy="25" r="0.65" fill="#168043"/><circle cx="30" cy="150" r="0.65" fill="#168043"/></g></svg>